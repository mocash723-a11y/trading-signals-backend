services:
  # Main web service (your API)
  - type: web
    name: trading-signals-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false

  # Cron job for automatic AI training (runs every 12 hours)
  - type: cron
    name: train-ai-model
    env: python
    schedule: "0 */12 * * *"   # Runs at minute 0 of every 12th hour (00:00, 12:00 UTC)
    buildCommand: pip install -r requirements.txt
    startCommand: python train_model.py
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
